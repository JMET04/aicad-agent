name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r agent-plugin/aicad-agent/requirements-packaging.txt
      - run: python -B -m unittest discover -s tests -v
      - run: python -B -m unittest discover -s agent-plugin/aicad-agent/tests -v
      - shell: powershell
        run: ./scripts/build-agent-plugin.ps1 -OutputDirectory release/ci -Version 1.11.0
      - run: python -B scripts/verify_release_package.py release/ci/aicad-agent
      - shell: powershell
        run: ./scripts/build-github-source.ps1 -OutputDirectory release/ci/github-repository -Version 1.11.0 -PluginArchive release/ci/aicad-agent-1.11.0.zip -PluginDirectory release/ci/aicad-agent
      - run: python -B scripts/verify_github_source.py release/ci/github-repository
      - shell: powershell
        working-directory: release/ci/github-repository/plugins/aicad-agent
        run: python -B -m unittest discover -s tests -v
