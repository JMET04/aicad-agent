name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r agent-plugin/aicad-agent/requirements-packaging.txt
      - run: python -B -m unittest discover -s tests -v
      - run: python -B -m unittest discover -s agent-plugin/aicad-agent/tests -v
      - shell: powershell
        run: ./scripts/build-agent-plugin.ps1 -OutputDirectory release-ci
      - run: python -B scripts/verify_release_package.py release-ci/aicad-agent

