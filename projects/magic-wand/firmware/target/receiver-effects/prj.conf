# Candidate configuration for nRF Connect SDK v3.4.0 / Zephyr v4.4.0.
# Presence of this file is not evidence of a target build, flash or HIL pass.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_NVS_DATA_CRC=y

# Required when the ARM MPU protects internal flash writes on this target.
CONFIG_MPU_ALLOW_FLASH_WRITE=y
