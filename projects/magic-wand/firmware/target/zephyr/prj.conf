# Target baseline: nRF Connect SDK v3.4.0 / Zephyr v4.4.0.
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_LSM6DSV16X=y
CONFIG_LSM6DSV16X_TRIGGER_GLOBAL_THREAD=y
CONFIG_WATCHDOG=y
CONFIG_FPU=y

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n

CONFIG_ASSERT=y
CONFIG_STACK_SENTINEL=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Radio/security integration is intentionally outside this hardware target
# gate. The weak secure-event sink fails closed with -ENOTSUP.
CONFIG_BT=n
CONFIG_IEEE802154=n
CONFIG_USB_DEVICE_STACK=n
CONFIG_MCUMGR=n

# Release gates are fail-closed by default.
CONFIG_MW_AXIS_MAP_APPROVED=n
CONFIG_MW_C08_005_ACTUATOR_APPROVED=n
